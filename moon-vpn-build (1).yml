name: Build Moon VPN APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android licenses
        run: sdkmanager --licenses

      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Verify build script
        run: |
          test -f build_moon.sh
          bash -n build_moon.sh

      - name: Build APK
        env:
          MOON_WORK: ${{ github.workspace }}/build
        run: bash build_moon.sh

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: moon-vpn-apk
          path: build/MoonVPN/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: moon-vpn-build-log
          path: |
            build/MoonVPN/gradle_build.log
            build/MoonVPN-build-*/gradle_build.log
          if-no-files-found: warn
          retention-days: 7
