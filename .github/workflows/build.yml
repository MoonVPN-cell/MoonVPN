name: Build Moon VPN APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android components
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # АВТО-ИСПРАВЛЕНИЕ И ДОБАВЛЕНИЕ БУФЕРА ОБМЕНА (ЧЕРЕЗ SED И PYTHON)
      - name: Auto-Fix & Add Clipboard
        run: |
          python3 -c "
          with open('build_moon.sh', 'r') as f:
              lines = f.readlines()

          # 1. Добавляем нужные импорты
          for i, line in enumerate(lines):
              if 'import android.os.Bundle' in line:
                  lines.insert(i, 'import androidx.compose.material3.darkColorScheme\n')
                  lines.insert(i, 'import androidx.compose.material3.MaterialTheme\n')
                  break
                  
          for i, line in enumerate(lines):
              if 'import com.moon.vpn.*' in line:
                  lines.insert(i+1, 'import com.moon.vpn.R\n')
                  break

          # 2. Заменяем строку с текстовым полем на версию с буфером обмена
          for i, line in enumerate(lines):
              if 'OutlinedTextField(value = inputUrl' in line:
                  lines[i] = '''val clipboardManager = androidx.compose.ui.platform.LocalClipboardManager.current
                      OutlinedTextField(
                          value = inputUrl, onValueChange = { inputUrl = it }, modifier = Modifier.fillMaxWidth(), placeholder = { Text(\"https://...\") },
                          colors = OutlinedTextFieldDefaults.colors(focusedContainerColor = Moon.Bg, unfocusedContainerColor = Moon.Bg),
                          trailingIcon = {
                              IconButton(onClick = {
                                  val clipText = clipboardManager.getText()?.text
                                  if (!clipText.isNullOrBlank()) inputUrl = clipText
                              }) {
                                  Icon(Icons.Default.ContentPaste, contentDescription = \"Вставить\", tint = Moon.Muted)
                              }
                          }
                      )\n'''
                  break

          with open('build_moon.sh', 'w') as f:
              f.writelines(lines)
          "

      - name: Build APK
        env:
          MOON_WORK: ${{ github.workspace }}/build
        run: bash build_moon.sh

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: moon-vpn-apk
          path: build/MoonVPN/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
