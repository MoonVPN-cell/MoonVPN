name: Build Moon VPN APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android components
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # АВТО-ИСПРАВЛЕНИЕ И УЛУЧШЕНИЕ ЗАГРУЗЧИКА ПОДПИСОК
      - name: Auto-Fix & Upgrade Fetcher
        run: |
          python3 -c "
          import re
          with open('build_moon.sh', 'r') as f:
              code = f.read()

          # 1. Убираем конфликты JVM (setters)
          replacements = {
              'fun setSubscriptions': 'fun updateSubscriptions',
              'setSubscriptions(': 'updateSubscriptions(',
              'fun setAutoConnect': 'fun updateAutoConnect',
              'setAutoConnect(': 'updateAutoConnect(',
              'fun setKillSwitch': 'fun updateKillSwitch',
              'setKillSwitch(': 'updateKillSwitch(',
              'fun setNotifications': 'fun updateNotifications',
              'setNotifications(': 'updateNotifications(',
              'fun setMoonShield': 'fun updateMoonShield',
              'setMoonShield(': 'updateMoonShield(',
              'fun setStealthMode': 'fun updateStealthMode',
              'setStealthMode(': 'updateStealthMode('
          }
          for old, new in replacements.items():
              code = code.replace(old, new)
          code = code.replace('ConnState.CONNECTED, ConnState.CONNECTING -> disconnect()', 'ConnState.CONNECTED, ConnState.CONNECTING, ConnState.RECONNECTING -> disconnect()')

          # 2. УЛУЧШАЕМ SubscriptionFetcher (Мульти-маскировка)
          new_fetcher = '''
          package com.moon.vpn

          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import java.net.SocketTimeoutException
          import java.net.UnknownHostException
          import java.util.concurrent.TimeUnit

          object SubscriptionFetcher {
              private val client = OkHttpClient.Builder()
                  .connectTimeout(15, TimeUnit.SECONDS)
                  .readTimeout(20, TimeUnit.SECONDS)
                  .build()

              suspend fun fetch(url: String): Result<String> = withContext(Dispatchers.IO) {
                  val userAgents = listOf(\"INCY/1.0\", \"Happ/2.0\", \"v2rayNG/1.8.0\", \"Mozilla/5.0\")
                  var lastError: Exception? = null

                  for (ua in userAgents) {
                      try {
                          val req = Request.Builder().url(url).header(\"User-Agent\", ua).build()
                          client.newCall(req).execute().use { r ->
                              if (r.isSuccessful) {
                                  val body = r.body?.string() ?: \"\"
                                  if (body.contains(\"0.0.0.0\") || body.contains(\"App not supported\")) {
                                      lastError = Exception(\"Провайдер блокирует запрос (Заглушка 0.0.0.0)\")
                                      continue
                                  }
                                  return@withContext Result.success(body)
                              } else {
                                  lastError = Exception(\"Ошибка сети: \${r.code}\")
                              }
                          }
                      } catch (e: SocketTimeoutException) {
                          lastError = Exception(\"Превышено время ожидания\")
                      } catch (e: UnknownHostException) {
                          lastError = Exception(\"Не удалось найти сервер\")
                      } catch (e: Exception) {
                          lastError = Exception(\"Ошибка: \${e.message}\")
                      }
                  }
                  Result.failure(lastError ?: Exception(\"Не удалось получить данные\"))
              }
          }
          '''
          
          # Заменяем старый SubscriptionFetcher на новый
          pattern = r\"cat > \\\"\\\$BASE/SubscriptionFetcher\\.kt\\\" <<'EOF'\\n.*?\\nEOF\"
          replacement = \"cat > \\\"\\\$BASE/SubscriptionFetcher.kt\\\" <<'EOF'\\n\" + new_fetcher + \"\\nEOF\"
          code = re.sub(pattern, replacement, code, flags=re.DOTALL)

          with open('build_moon.sh', 'w') as f:
              f.write(code)
          "

      - name: Build APK
        env:
          MOON_WORK: ${{ github.workspace }}/build
        run: |
          set +e
          bash build_moon.sh 2>&1 | tee build_output.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=========================================="
            echo "🔴 ТОЧНЫЕ ОШИБКИ КОМПИЛЯЦИИ:"
            echo "=========================================="
            grep -E "^e: |error:" build_output.log || true
            echo "=========================================="
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: moon-vpn-apk
          path: build/MoonVPN/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
