name: Build Moon VPN APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android components
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Patch Script (Auto-Fix Errors)
        run: |
          python3 -c "
          with open('build_moon.sh', 'r') as f:
              content = f.read()

          # 1. Исправляем типы данных для libv2ray
          content = content.replace('override fun startup(): Int = 0', 'override fun startup(): Long = 0')
          content = content.replace('override fun shutdown(): Int = 0', 'override fun shutdown(): Long = 0')
          content = content.replace('override fun onEmitStatus(code: Int, message: String): Int {', 'override fun onEmitStatus(code: Long, message: String?): Long {')
          content = content.replace('if (code != 0) sendError(\"Xray: \$message\"); return 0', 'if (code != 0L) sendError(\"Xray: \$message\"); return 0L')

          # 2. Исправляем названия цветов для Compose TextField
          content = content.replace('import androidx.compose.material3.TextFieldDefaults', 'import androidx.compose.material3.OutlinedTextFieldDefaults')
          content = content.replace('TextFieldDefaults.colors', 'OutlinedTextFieldDefaults.colors')
          content = content.replace('focusedIndicatorColor', 'focusedBorderColor')
          content = content.replace('unfocusedIndicatorColor', 'unfocusedBorderColor')

          # 3. Заменяем отсутствующую иконку
          content = content.replace('Icons.Default.Zap', 'Icons.Default.Settings')

          # 4. Убираем конфликт JVM сигнатур (переименовываем функции)
          content = content.replace('setSubscriptions', 'updateSubscriptions')
          content = content.replace('setAutoConnect', 'updateAutoConnect')
          content = content.replace('setKillSwitch', 'updateKillSwitch')
          content = content.replace('setNotifications', 'updateNotifications')

          with open('build_moon.sh', 'w') as f:
              f.write(content)
          "

      - name: Build APK
        env:
          MOON_WORK: ${{ github.workspace }}/build
        run: |
          set +e
          bash build_moon.sh 2>&1 | tee build_output.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=========================================="
            echo "🔴 ТОЧНЫЕ ОШИБКИ КОМПИЛЯЦИИ:"
            echo "=========================================="
            grep -E "^e: |error:" build_output.log || true
            echo "=========================================="
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: moon-vpn-apk
          path: build/MoonVPN/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
