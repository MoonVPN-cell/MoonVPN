name: Build Moon VPN APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android components
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # АВТО-ИСПРАВЛЕНИЕ И ДОБАВЛЕНИЕ БУФЕРА ОБМЕНА
      - name: Auto-Fix & Add Clipboard Button
        run: |
          python3 -c "
          with open('build_moon.sh', 'r') as f:
              code = f.read()

          # 1. Исправляем импорты в MainActivity.kt (MaterialTheme)
          code = code.replace(
              'import android.content.*\nimport android.os.Bundle',
              'import android.content.*\nimport androidx.compose.material3.MaterialTheme\nimport androidx.compose.material3.darkColorScheme\nimport android.os.Bundle'
          )

          # 2. Исправляем импорты в HomeScreen.kt (R)
          code = code.replace(
              'import com.moon.vpn.*\n',
              'import com.moon.vpn.*\nimport com.moon.vpn.R\n'
          )

          # 3. Добавляем кнопку вставки из буфера обмена
          old_textfield = 'OutlinedTextField(value = inputUrl, onValueChange = { inputUrl = it }, modifier = Modifier.fillMaxWidth(), placeholder = { Text(\"https://...\") }, colors = OutlinedTextFieldDefaults.colors(focusedContainerColor = Moon.Bg, unfocusedContainerColor = Moon.Bg))'
          
          new_textfield = '''val clipboardManager = androidx.compose.ui.platform.LocalClipboardManager.current
                OutlinedTextField(
                    value = inputUrl, onValueChange = { inputUrl = it }, modifier = Modifier.fillMaxWidth(), placeholder = { Text(\"https://...\") },
                    colors = OutlinedTextFieldDefaults.colors(focusedContainerColor = Moon.Bg, unfocusedContainerColor = Moon.Bg),
                    trailingIcon = {
                        IconButton(onClick = {
                            val clipText = clipboardManager.getText()?.text
                            if (!clipText.isNullOrBlank()) inputUrl = clipText
                        }) {
                            Icon(Icons.Default.ContentPaste, contentDescription = \"Вставить\", tint = Moon.Muted)
                        }
                    }
                )'''
          
          code = code.replace(old_textfield, new_textfield)

          with open('build_moon.sh', 'w') as f:
              f.write(code)
          "

      - name: Build APK
        env:
          MOON_WORK: ${{ github.workspace }}/build
        run: bash build_moon.sh

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: moon-vpn-apk
          path: build/MoonVPN/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
