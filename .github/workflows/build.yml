name: Build Moon VPN APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android components
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # АВТО-ИСПРАВЛЕНИЕ КОДА (переименование функций, чтобы не было конфликтов)
      - name: Auto-Fix Script
        run: |
          python3 -c "
          with open('build_moon.sh', 'r') as f:
              code = f.read()

          # Убираем конфликты JVM (переименовываем функции)
          replacements = {
              'fun setSubscriptions': 'fun updateSubscriptions',
              'setSubscriptions(': 'updateSubscriptions(',
              'fun setAutoConnect': 'fun updateAutoConnect',
              'setAutoConnect(': 'updateAutoConnect(',
              'fun setKillSwitch': 'fun updateKillSwitch',
              'setKillSwitch(': 'updateKillSwitch(',
              'fun setNotifications': 'fun updateNotifications',
              'setNotifications(': 'updateNotifications(',
              'fun setMoonShield': 'fun updateMoonShield',
              'setMoonShield(': 'updateMoonShield(',
              'fun setStealthMode': 'fun updateStealthMode',
              'setStealthMode(': 'updateStealthMode('
          }

          for old, new in replacements.items():
              code = code.replace(old, new)

          # Добавляем недостающую ветку RECONNECTING
          code = code.replace('ConnState.CONNECTED, ConnState.CONNECTING -> disconnect()', 'ConnState.CONNECTED, ConnState.CONNECTING, ConnState.RECONNECTING -> disconnect()')

          with open('build_moon.sh', 'w') as f:
              f.write(code)
          "

      - name: Build APK
        env:
          MOON_WORK: ${{ github.workspace }}/build
        run: |
          set +e
          bash build_moon.sh 2>&1 | tee build_output.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=========================================="
            echo "🔴 ТОЧНЫЕ ОШИБКИ КОМПИЛЯЦИИ:"
            echo "=========================================="
            grep -E "^e: |error:" build_output.log || true
            echo "=========================================="
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: moon-vpn-apk
          path: build/MoonVPN/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
