name: Build Moon VPN APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android components
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Patch Script
        run: |
          sed -i 's/| tail -40//g' build_moon.sh
          sed -i 's/TextFieldDefaults.colors/OutlinedTextFieldDefaults.colors/g' build_moon.sh
          sed -i 's/import androidx.compose.material3.TextFieldDefaults/import androidx.compose.material3.OutlinedTextFieldDefaults/g' build_moon.sh
          sed -i 's/material-icons-extended")/material-icons-extended:1.6.8")/g' build_moon.sh

      - name: Build APK
        env:
          MOON_WORK: ${{ github.workspace }}/build
        run: |
          set +e
          bash build_moon.sh 2>&1 | tee build_output.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=========================================="
            echo "🔴 ТОЧНЫЕ ОШИБКИ КОМПИЛЯЦИИ:"
            echo "=========================================="
            grep -E "^e: |error:" build_output.log || true
            echo "=========================================="
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: moon-vpn-apk
          path: build/MoonVPN/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
