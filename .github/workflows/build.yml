name: Build Moon VPN APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android components
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # АВТО-ИСПРАВЛЕНИЕ СКРИПТА
      - name: Auto-Fix Script
        run: |
          python3 -c "
          with open('build_moon.sh', 'r') as f:
              code = f.read()

          # 1. libv2ray (Int -> Long)
          code = code.replace('override fun startup(): Int = 0', 'override fun startup(): Long = 0')
          code = code.replace('override fun shutdown(): Int = 0', 'override fun shutdown(): Long = 0')
          code = code.replace('override fun onEmitStatus(code: Int, message: String): Int {', 'override fun onEmitStatus(code: Long, message: String?): Long {')
          code = code.replace('if (code != 0) sendError(\"Xray: \$message\"); return 0', 'if (code != 0L) sendError(\"Xray: \$message\"); return 0L')

          # 2. Исправляем двойной Outlined и цвета Compose
          code = code.replace('OutlinedOutlinedTextFieldDefaults', 'OutlinedTextFieldDefaults')
          code = code.replace('= TextFieldDefaults.colors(', '= OutlinedTextFieldDefaults.colors(')
          code = code.replace('focusedIndicatorColor', 'focusedBorderColor')
          code = code.replace('unfocusedIndicatorColor', 'unfocusedBorderColor')

          # 3. Иконки
          code = code.replace('Icons.Default.Zap', 'Icons.Default.Settings')

          # 4. Конфликты JVM (setters)
          code = code.replace('fun setSubscriptions', 'fun updateSubscriptions')
          code = code.replace('setSubscriptions(', 'updateSubscriptions(')
          code = code.replace('fun setAutoConnect', 'fun updateAutoConnect')
          code = code.replace('setAutoConnect(', 'updateAutoConnect(')
          code = code.replace('fun setKillSwitch', 'fun updateKillSwitch')
          code = code.replace('setKillSwitch(', 'updateKillSwitch(')
          code = code.replace('fun setNotifications', 'fun updateNotifications')
          code = code.replace('setNotifications(', 'updateNotifications(')

          # 5. Добавляем недостающую ветку RECONNECTING в MainActivity
          code = code.replace('ConnState.CONNECTED, ConnState.CONNECTING -> disconnect()', 'ConnState.CONNECTED, ConnState.CONNECTING, ConnState.RECONNECTING -> disconnect()')

          with open('build_moon.sh', 'w') as f:
              f.write(code)
          "

      - name: Build APK
        env:
          MOON_WORK: ${{ github.workspace }}/build
        run: |
          set +e
          bash build_moon.sh 2>&1 | tee build_output.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=========================================="
            echo "🔴 ТОЧНЫЕ ОШИБКИ КОМПИЛЯЦИИ:"
            echo "=========================================="
            grep -E "^e: |error:" build_output.log || true
            echo "=========================================="
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: moon-vpn-apk
          path: build/MoonVPN/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
